
name: Gradle CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile project
        run: ./gradlew assemble

  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        run: ./gradlew test

  release:
    name: 3. Pseudo Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release artifact
        run: ./gradlew assemble

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: '**/build/libs/*.jar'
          if-no-files-found: error
